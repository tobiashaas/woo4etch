name: Test

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'templates/etch-copy/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'templates/etch-copy/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  # Layer 1 — the plugin header claims "Requires PHP: 8.1" (Etch's own floor);
  # verify every file parses on each supported version through next stable.
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Lint all plugin PHP files
        run: |
          find plugin/woo4etch -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  # Layers 2–3 — fast, service-free checks: version markers, the shortcode
  # catalog, and the layout DSL invariants. Plus a drift guard ensuring the
  # committed copy/paste artifacts still match the layout source of truth.
  checks:
    name: Consistency & layout checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none

      - name: Run consistency & layout tests
        run: php tests/php/run.php

      - name: Verify etch-copy artifacts are in sync with the layout source
        run: |
          php tools/generate-etch-copy.php
          if ! git diff --exit-code -- templates/etch-copy/; then
            echo "::error::templates/etch-copy/*.json is out of date. Run 'php tools/generate-etch-copy.php' and commit the result."
            exit 1
          fi
