name: Test

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'templates/etch-copy/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'templates/etch-copy/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  # Layer 1 — the plugin header claims "Requires PHP: 8.1" (Etch's own floor);
  # verify every file parses on each supported version through next stable.
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Lint all plugin PHP files
        run: |
          find plugin/woo4etch -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  # Layers 2–3 — fast, service-free checks: version markers, the shortcode
  # catalog, and the layout DSL invariants. Plus a drift guard ensuring the
  # committed copy/paste artifacts still match the layout source of truth.
  checks:
    name: Consistency & layout checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none

      - name: Run consistency & layout tests
        run: php tests/php/run.php

      - name: Verify etch-copy artifacts are in sync with the layout source
        run: |
          php tools/generate-etch-copy.php
          if ! git diff --exit-code -- templates/etch-copy/; then
            echo "::error::templates/etch-copy/*.json is out of date. Run 'php tools/generate-etch-copy.php' and commit the result."
            exit 1
          fi

  # Layers 4–5 — integration checks against a real WordPress + WooCommerce
  # (wp-env / Docker; slower, so a separate job off the fast path). Etch is a
  # paid plugin and not available here — the Etch-dependent assertions in the
  # checks skip themselves; full runs incl. Etch happen against staging via
  # tests/integration/run.sh --ssh (see tests/integration/README.md).
  integration:
    name: Integration (wp-env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write CI wp-env config
        run: |
          cat > .wp-env.json <<'EOF'
          {
            "core": null,
            "phpVersion": "8.3",
            "plugins": [
              "https://downloads.wordpress.org/plugin/woocommerce.zip"
            ],
            "mappings": {
              "wp-content/plugins/woo4etch": "./plugin/woo4etch",
              "wp-content/woo4etch-tests": "./tests"
            }
          }
          EOF

      - name: Start wp-env
        run: npx --yes @wordpress/env@latest start

      - name: Activate plugin and seed a product
        run: |
          npx @wordpress/env run cli -- wp plugin activate woo4etch
          npx @wordpress/env run cli -- wp option update woocommerce_coming_soon no
          npx @wordpress/env run cli -- wp wc product create --name="CI Test Product" --type=simple --regular_price=9.99 --status=publish --user=admin

      - name: Run integration checks
        run: tests/integration/run.sh --wp-env
