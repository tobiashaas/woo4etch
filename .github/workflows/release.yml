name: Release

on:
  push:
    tags:
      - 'v*'
  # Release directly from main: the tag is derived from the plugin's
  # Version: header and created by action-gh-release at the dispatched
  # commit. Equivalent to pushing the matching v* tag by hand.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
          coverage: none

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 '^[[:space:]]*\*[[:space:]]Version:' plugin/woo4etch/woo4etch.php | sed 's/.*Version:[[:space:]]*//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="v${{ steps.version.outputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PLUGIN_VERSION="${{ steps.version.outputs.version }}"
          STABLE_TAG=$(grep -m1 '^Stable tag:' plugin/woo4etch/readme.txt | sed 's/.*Stable tag:[[:space:]]*//')
          echo "Tag: ${TAG_VERSION} | woo4etch.php: ${PLUGIN_VERSION} | readme.txt: ${STABLE_TAG}"
          if [ "${TAG_VERSION}" != "${PLUGIN_VERSION}" ]; then
            echo "::error::Git tag (${TAG_VERSION}) does not match Version in woo4etch.php (${PLUGIN_VERSION})."
            exit 1
          fi
          if [ "${STABLE_TAG}" != "${PLUGIN_VERSION}" ]; then
            echo "::error::Stable tag in readme.txt (${STABLE_TAG}) does not match Version in woo4etch.php (${PLUGIN_VERSION})."
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      - name: Lint plugin PHP
        run: |
          find plugin/woo4etch -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Build installable zip
        run: |
          cd plugin
          zip -r ../woo4etch.zip woo4etch -x "*.git*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Only used when the tag doesn't exist yet (workflow_dispatch);
          # ignored for tag-push runs where the tag already points somewhere.
          target_commitish: ${{ github.sha }}
          name: Woo4Etch ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: woo4etch.zip
          draft: false
          # Tags with a suffix (v1.5.0-beta.1) become GitHub pre-releases.
          # The updater reads releases/latest, which skips pre-releases, so
          # betas are never offered to installed sites automatically.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
